name: Build Windows app

# Builds the Idea Lab desktop installer (.exe + .msi) on a Windows machine.
# Run it from the GitHub "Actions" tab (Run workflow), or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run desktop:build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: idea-lab-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Idea Lab ${{ github.ref_name }}
          body: |
            **Windows:** download `Idea.Lab_..._x64-setup.exe` below and run it.
            The installer adds an Idea Lab icon to your desktop and Start menu.
            If Windows SmartScreen warns you, click "More info" → "Run anyway" (the app isn't code-signed yet).
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
