name: Build & release Windows app

# Every push to main (or a manual run from the Actions tab) builds a new
# version 0.2.<run number>, signs it, and publishes it to the PUBLIC repo
# vicuvi1/idea-lab-releases. The installed app checks that repo for updates.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  – the updater signing key
#   RELEASES_TOKEN             – fine-grained token with "Contents: read & write"
#                                on vicuvi1/idea-lab-releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - name: Check secrets are set
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY set: $HAS_KEY"
          echo "RELEASES_TOKEN set: $HAS_TOKEN"
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (add it under Settings → Secrets and variables → Actions → Repository secrets)."; fi
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::Secret RELEASES_TOKEN is missing (add it under Settings → Secrets and variables → Actions → Repository secrets)."; fi
          [ "$HAS_KEY" = "true" ] && [ "$HAS_TOKEN" = "true" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Set version ${{ env.VERSION }}
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            for (const f of ['package.json','src-tauri/tauri.conf.json']) {
              const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');
            }"

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          owner: vicuvi1
          repo: idea-lab-releases
          tagName: v${{ env.VERSION }}
          releaseName: Idea Lab v${{ env.VERSION }}
          releaseBody: |
            ${{ github.event.head_commit.message || 'Manual build' }}

            **New install:** download `Idea.Lab_${{ env.VERSION }}_x64-setup.exe` below and run it.
            **Already installed:** open Idea Lab and click "Update" — it updates itself.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Keep installers as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea-lab-windows-${{ env.VERSION }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
