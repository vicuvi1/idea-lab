name: Build & release Windows app

# Every push to main (or a manual run from the Actions tab) builds a new
# version 0.2.<run number>, signs it, and publishes it to the PUBLIC repo
# vicuvi1/idea-lab-releases. The installed app checks that repo for updates.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  – the updater signing key
#   RELEASES_TOKEN             – fine-grained token with "Contents: read & write"
#                                on vicuvi1/idea-lab-releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - name: Check secrets are set and look right
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ok=true
          if [ -z "$KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing."; ok=false
          elif ! printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d 2>/dev/null | head -c 40 | grep -q "untrusted comment"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a valid Tauri key. Paste the full contents of the idea-lab.key file (one long line, no 'github_pat_')."; ok=false
          else echo "TAURI_SIGNING_PRIVATE_KEY: looks valid"; fi
          if [ -z "$TOKEN" ]; then echo "::error::RELEASES_TOKEN is missing."; ok=false
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/vicuvi1/idea-lab-releases)
            # A release POST with no tag is rejected with 422 when we may write, 403/404 when we may not.
            write=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/vicuvi1/idea-lab-releases/releases -d '{}')
            if [ "$code" != "200" ]; then echo "::error::RELEASES_TOKEN can't access vicuvi1/idea-lab-releases (HTTP $code). Create a new fine-grained token for that repo with Contents: Read and write."; ok=false
            elif [ "$write" != "422" ]; then echo "::error::RELEASES_TOKEN can read but NOT create releases in vicuvi1/idea-lab-releases (HTTP $write). Edit the token: Repository permissions → Contents → Read and write."; ok=false
            else echo "RELEASES_TOKEN: can write to idea-lab-releases"; fi
          fi
          $ok
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Set version ${{ env.VERSION }}
        shell: bash
        run: |
          node -e "
            const fs=require('fs');
            for (const f of ['package.json','src-tauri/tauri.conf.json']) {
              const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');
            }"

      - name: Build, sign and publish release
        id: signed
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          owner: vicuvi1
          repo: idea-lab-releases
          tagName: v${{ env.VERSION }}
          releaseName: Idea Lab v${{ env.VERSION }}
          releaseBody: |
            ${{ github.event.head_commit.message || 'Manual build' }}

            **New install:** download `Idea.Lab_${{ env.VERSION }}_x64-setup.exe` below and run it.
            **Already installed:** open Idea Lab and click "Update" — it updates itself.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Fallback: if signing failed (e.g. wrong TAURI_SIGNING_PRIVATE_KEY), still publish
      # a normal installer so the app can be installed; self-update needs the signed build.
      - name: Fallback build without update signature
        if: steps.signed.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Signed build failed — publishing an UNSIGNED installer (auto-update won't see it). Check the TAURI_SIGNING_PRIVATE_KEY secret."
          npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Publish fallback installer
        if: steps.signed.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$VERSION" --repo vicuvi1/idea-lab-releases --title "Idea Lab v$VERSION" \
            --notes "Installer only (update signing failed for this build — install manually)." \
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Keep installers as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea-lab-windows-${{ env.VERSION }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
